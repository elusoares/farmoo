# Docker compose de desenvolvimento

services:
  animais:
    build:
      context: ./animais
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        # Sincroniza o código-fonte: alterações refletem na hora
        - action: sync
          path: ./animais/src
          target: /app/src
        # Rebuilda quando package.json ou package-lock.json mudam
        - action: rebuild
          path: ./animais/package.json
        - action: rebuild
          path: ./animais/package-lock.json