# Docker compose de produção

services:
  farmoo-database:
    image: postgres:17
    container_name: farmoo_db
    hostname: farmoo.db
    restart: always
    ports:
      - "${DB_HOST_PORT}:5432"
    environment:
      NODE_ENV: ${NODE_ENV}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ}
      PGTZ: ${PGTZ}
    volumes:
      - farmoo-database-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - farmoo-network

  animais:
    build:
      context: ./animais
      dockerfile: Dockerfile
    container_name: farmoo_animais
    restart: always
    ports:
      - "${ANIMAIS_HOST_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      TZ: ${TZ}
      PGTZ: ${PGTZ}
    depends_on:
      - farmoo-database
    networks:
      - farmoo-network

volumes:
  farmoo-database-data:

networks:
  farmoo-network:
    external: true